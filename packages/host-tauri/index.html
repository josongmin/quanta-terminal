<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quanta Terminal</title>
    <!-- Apply stored theme before first paint to prevent flash. Falls back to 'dark'. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('quanta:theme');
          var valid = ['light', 'dark', 'system'];
          var pref = valid.indexOf(stored) !== -1 ? stored : 'dark';
          if (pref === 'system') {
            pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      :root,
      html,
      body {
        background: #08090F;
        color: #E0E4F0;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #quanta-root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="quanta-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
