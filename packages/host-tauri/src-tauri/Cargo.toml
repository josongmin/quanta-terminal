[package]
name = "quanta-host-tauri"
version = "0.1.0"
edition = "2021"
description = "Quanta Terminal — Tauri desktop host (Mode B per ADR 0001)"
license = "Apache-2.0 OR MIT"

# This crate intentionally lives outside the root Cargo workspace: it depends
# on Tauri which has its own build constraints and a much larger dep graph,
# and we do not want normal `cargo test` in the root workspace to compile it.
[workspace]

[lib]
name = "quanta_host_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
# Enable Tauri's `test` feature only for the test build so MockRuntime is
# available to unit tests. Keeps the production binary's surface area small.
tauri = { version = "2.0", features = ["macos-private-api", "test"] }
tempfile = "3"

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-shell = "2.0"
# The updater plugin is always compiled in so release builds ship with
# auto-update support. The endpoint + pubkey are configured in
# `tauri.conf.json` under `plugins.updater`; see docs/RELEASE.md for how to
# generate the signing keypair. Until the pubkey placeholder is replaced,
# the plugin will refuse updates at signature-verification time.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
parking_lot = "0.12"
# Inline redactor in `crash.rs` uses these — cheaper than a full dep on
# `quanta-security` (which pulls in its own fixtures + versioning story).
once_cell = "1"
regex = "1"

# Phase-5 AI suggestion flow (ADR 0012). Path-depped so the host-tauri crate
# — which lives outside the main workspace — picks up the in-repo source.
quanta-ai = { path = "../../../crates/quanta-ai" }

# Crash-reporter integration point. The host wires `std::panic::set_hook`
# and a `quanta_report_crash` IPC command to the `FileSinkReporter` by
# default; a future PR can swap in a `SentryReporter`/`BugsnagReporter`
# adapter without touching this file.
quanta-crash-reporter = { path = "../../../crates/quanta-crash-reporter" }

# Phase-1 dev stub only — remove when the real `quanta-core` sidecar ships
# per ADR 0001 / ADR 0004. The `embedded-shell` feature gates this path.
portable-pty = { version = "0.8", optional = true }
bytes = { version = "1", optional = true }

# Sidecar path per ADR 0004: Tauri auto-spawns `quanta-core` and speaks the
# real MessagePack+JSON protocol over a Unix socket. These deps are OFF by
# default so `pnpm dev` keeps the lighter `embedded-shell` compile path.
quanta-protocol = { path = "../../../crates/quanta-protocol", optional = true }
quanta-proto = { path = "../../../crates/quanta-proto", optional = true }
# `which` is used by the sidecar resolver as the PATH-lookup fallback when no
# env override is set and the Tauri bundle doesn't carry the binary.
which = { version = "6", optional = true }

[features]
# Default enables the embedded dev shell so `pnpm dev` works end-to-end before
# the real engine binary is wired in. Opt-in to the sidecar with
# `--features sidecar` (you should disable `embedded-shell` at the same time
# so we never accidentally double-spawn a PTY).
default = ["embedded-shell"]
embedded-shell = ["dep:portable-pty", "dep:bytes"]
sidecar = ["dep:quanta-protocol", "dep:quanta-proto", "dep:which"]

[[bin]]
name = "quanta-host-tauri"
path = "src/main.rs"
