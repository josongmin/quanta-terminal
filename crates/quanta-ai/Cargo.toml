[package]
name = "quanta-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Quanta Terminal — AI suggestion flow + risk classifier per ADR 0012."

[lints]
workspace = true

[dependencies]
# The mock provider is async so we gate the port behind `async_trait` in
# `ports/`. Domain stays sync and dep-free.
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quanta-metrics = { path = "../quanta-metrics" }
# Phase-6 Anthropic adapter (ADR 0012). `rustls-tls` avoids the OpenSSL
# link so the Tauri host builds on fresh macOS without extra brew deps.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `tokio::time::timeout` backs the trait's default `suggest_with_timeout`
# implementation so every adapter honours the port's timing contract.
# We only pull the `time` feature to keep the crate's footprint tight;
# full tokio is already available transitively via reqwest, but
# depending on a feature slice here is more honest.
tokio = { version = "1.40", default-features = false, features = ["time"] }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }
# Local HTTP mock for the Anthropic adapter integration tests. Dev-only: the
# production adapter never pulls in wiremock.
wiremock = "0.6"
