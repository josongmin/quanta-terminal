[package]
name = "quanta-diagnostic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Quanta Terminal — diagnostic parser pipeline (ADR 0007). Tier-1 parsers: rustc/cargo, tsc, python traceback, node stack."

[lints]
workspace = true

[dependencies]
quanta-proto = { path = "../quanta-proto" }
thiserror = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
# encoding_rs gives us a streaming UTF-8 decoder with suspended-state support,
# so a 4-byte codepoint split across two PTY chunks decodes correctly instead
# of turning into U+FFFD. See FIX 3 in the audit.
encoding_rs = "0.8"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
